<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Customer Churn Prediction</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<button class="toggle-mode" onclick="toggleMode()">🌙 Toggle Mode</button>

<div class="container">

<h2>📊 Customer Churn Prediction</h2>

<form method="POST">

<div class="form-grid">

<div class="form-group">
<label>Senior Citizen (Yes=1, No=0)</label>
<input type="number" name="query1" required>
</div>

<div class="form-group">
<label>Monthly Charges</label>
<input type="number" name="query2" required>
</div>

<div class="form-group">
<label>Total Charges</label>
<input type="number" name="query3" required>
</div>

<div class="form-group">
<label>Gender</label>
<select name="query4">
<option>Male</option>
<option>Female</option>
</select>
</div>

<div class="form-group">
<label>Partner</label>
<select name="query5">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="form-group">
<label>Dependents</label>
<select name="query6">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="form-group">
<label>Phone Service</label>
<select name="query7">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="form-group">
<label>Multiple Lines</label>
<select name="query8">
<option>Yes</option>
<option>No</option>
<option>No phone service</option>
</select>
</div>

<div class="form-group">
<label>Internet Service</label>
<select name="query9">
<option>DSL</option>
<option>Fiber optic</option>
<option>No</option>
</select>
</div>

<div class="form-group">
<label>Online Security</label>
<select name="query10">
<option>Yes</option>
<option>No</option>
<option>No internet service</option>
</select>
</div>

<div class="form-group">
<label>Online Backup</label>
<select name="query11">
<option>Yes</option>
<option>No</option>
<option>No internet service</option>
</select>
</div>

<div class="form-group">
<label>Device Protection</label>
<select name="query12">
<option>Yes</option>
<option>No</option>
<option>No internet service</option>
</select>
</div>

<div class="form-group">
<label>Tech Support</label>
<select name="query13">
<option>Yes</option>
<option>No</option>
<option>No internet service</option>
</select>
</div>

<div class="form-group">
<label>Streaming TV</label>
<select name="query14">
<option>Yes</option>
<option>No</option>
<option>No internet service</option>
</select>
</div>

<div class="form-group">
<label>Streaming Movies</label>
<select name="query15">
<option>Yes</option>
<option>No</option>
<option>No internet service</option>
</select>
</div>

<div class="form-group">
<label>Contract</label>
<select name="query16">
<option>Month-to-month</option>
<option>One year</option>
<option>Two year</option>
</select>
</div>

<div class="form-group">
<label>Paperless Billing</label>
<select name="query17">
<option>Yes</option>
<option>No</option>
</select>
</div>

<div class="form-group">
<label>Payment Method</label>
<select name="query18">
<option>Electronic check</option>
<option>Mailed check</option>
<option>Bank transfer (automatic)</option>
<option>Credit card (automatic)</option>
</select>
</div>

<div class="form-group">
<label>Tenure (months)</label>
<input type="number" name="query19" required>
</div>

</div>

<center>
<button type="submit">🚀 Predict Churn</button>
</center>

</form>

</div>

<script>
function toggleMode(){
document.body.classList.toggle("light-mode");
}
</script>

</body>
</html>
