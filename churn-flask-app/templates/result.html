<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Prediction Result</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    text-align:center;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

/* MAIN CARD */
.card{
    background:#1e293b;
    padding:30px;
    margin:40px auto;
    width:420px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

/* BUTTONS */
a{
    display:inline-block;
    margin:10px;
    padding:10px 20px;
    background:#6a11cb;
    color:white;
    text-decoration:none;
    border-radius:20px;
}

/* PROGRESS BAR */
.progress{
    background:#333;
    border-radius:10px;
    overflow:hidden;
    margin:15px 0;
}

.progress-fill{
    height:20px;
    text-align:center;
    color:white;
    line-height:20px;
}

/* SUGGESTIONS */
.suggestions{
    margin-top:20px;
    text-align:left;
}

.suggestion-box{
    background:#0f172a;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border-left:4px solid #4CAF50;
    transition:0.3s;
}

.suggestion-box:hover{
    transform:scale(1.03);
    background:#1e40af;
}

</style>

</head>

<body>

<div class="card">

<h2>📊 Prediction Result</h2>

<!-- Prediction -->
{% if "CHURN" in output %}
<h3 style="color:#ff4d4d;">⚠ {{output}}</h3>
{% else %}
<h3 style="color:#4CAF50;">✅ {{output}}</h3>
{% endif %}

<p>Confidence: <b>{{confidence}}%</b></p>

<!-- Progress Bar -->
<div class="progress">
<div class="progress-fill"
style="
width: {{confidence}}%;
background: {{ '#ff4d4d' if 'CHURN' in output else '#4CAF50' }};
">
{{confidence}}%
</div>
</div>


<!-- Chart -->
<canvas id="chart" width="250"></canvas>

<!-- SMART SUGGESTIONS -->
<div class="suggestions">

<h3>💡 Smart Suggestions</h3>

{% for s in suggestions %}
<div class="suggestion-box">
✔ {{s}}
</div>
{% endfor %}

</div>

<br>

<a href="/">⬅ Predict Again</a>
<a href="/dashboard">📊 View Dashboard</a>

</div>

<script>

// SAFE values
const churn = {{ churn | default(0) }};
const stay = {{ stay | default(0) }};

// Chart
new Chart(document.getElementById("chart"), {
type: "doughnut",
data: {
labels: ["Churn", "Stay"],
datasets: [{
data: [churn, stay],
backgroundColor: ["#ff4d4d", "#4CAF50"]
}]
},
options:{
cutout:'70%',
plugins:{
legend:{ position:'bottom' }
}
}
});

</script>

</body>
</html>
