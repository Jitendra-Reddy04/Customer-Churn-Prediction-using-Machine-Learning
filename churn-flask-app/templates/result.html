<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Prediction Result</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

.result-container{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.result-card{

width:500px;
padding:40px;
border-radius:20px;
text-align:center;
background:#1e293b;
box-shadow:0 10px 30px rgba(0,0,0,0.5);

}

.result-title{
font-size:28px;
margin-bottom:20px;
}

.result-icon{
font-size:40px;
margin-bottom:10px;
}

.confidence{
margin-top:10px;
font-size:18px;
}

.chart-box{
width:260px;
margin:30px auto;
}

.progress{
width:100%;
background:#333;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

.progress-fill{
height:16px;
background:linear-gradient(90deg,#6a11cb,#2575fc);
width:0%;
transition:1.2s;
}

.buttons{
margin-top:25px;
}

.buttons a{

display:inline-block;
margin:8px;
padding:10px 20px;
border-radius:25px;
background:#6a11cb;
color:white;
text-decoration:none;

}

</style>

</head>

<body>

<div class="result-container">

<div class="result-card">

<h2 class="result-title">Prediction Result</h2>

<div class="result-icon">

{% if "CHURN" in output1 %}
⚠️
{% else %}
✅
{% endif %}

</div>

<h3>{{output1}}</h3>

<p class="confidence">{{output2}}</p>

<div class="progress">
<div id="progressBar" class="progress-fill"></div>
</div>

<div class="chart-box">
<canvas id="probChart"></canvas>
</div>

<div class="buttons">

<a href="/">⬅ Predict Again</a>

<a href="/dashboard">📊 View Dashboard</a>

</div>

</div>

</div>

<script>

/* Progress bar animation */

setTimeout(()=>{
document.getElementById("progressBar").style.width="{{probability}}%";
},300);

/* Chart */

const churn = {{probability}};
const stay = {{stay}};

new Chart(document.getElementById("probChart"),{

type:'doughnut',

data:{
labels:['Churn Probability','Stay Probability'],
datasets:[{
data:[churn, stay],
backgroundColor:['#ff4d4d','#4CAF50']
}]
},

options:{
cutout:'70%',
plugins:{
legend:{
position:'bottom'
}
}
}

});

</script>

</body>
</html>
